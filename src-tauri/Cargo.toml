[package]
name = "waktu"
version = "0.2.0"
description = "Waktu — menubar prayer-times app"
edition = "2021"

[lib]
name = "waktu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.9"
tokio = { version = "1", features = ["time"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSWindow", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSEnumerator"] }

[[bin]]
name = "waktu"
path = "src/main.rs"
